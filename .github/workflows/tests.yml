name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and lineage-consumer tests
        run: python -m unittest discover -s tests -v

  cross-repo-lineage-writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact accepted Action Lineage Graph producer
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/GlacierEQ/palantir-action-lineage-graph.git /tmp/action-lineage
          git -C /tmp/action-lineage checkout --quiet 5c18d0032da281a2f737f7c5107bbbca669b1469
          test "$(git -C /tmp/action-lineage rev-parse HEAD)" = "5c18d0032da281a2f737f7c5107bbbca669b1469"
      - name: Execute producer proof through consumer transaction
        run: python scripts/operate.py --lineage-repo /tmp/action-lineage
